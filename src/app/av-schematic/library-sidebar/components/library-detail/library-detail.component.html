<div class="detail-toolbar">
  <button
    class="back-button"
    type="button"
    aria-label="Back to library"
    appTooltip="Back to library"
    tooltipPlacement="right"
    (click)="onBack()"
  >
    <span class="icon icon-arrow-left" aria-hidden="true"></span>
  </button>
  <span class="detail-title h10">{{ title() }}</span>
</div>

<div class="detail-form">
  <app-device-form [entityId]="libraryId()" [nodeData]="initialTemplate()" />
</div>

<div class="sidebar-actions">
  <button class="primary-button p10" type="button" (click)="onSave()" [disabled]="!canSave()">
    Save
  </button>
  @if (mode() === 'edit') {
    <button class="remove-button p10" type="button" (click)="onRemove()">
      Remove from library
    </button>
  }
</div>
