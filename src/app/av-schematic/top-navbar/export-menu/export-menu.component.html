@let open = isOpen();
<!-- Wrapper listens for Escape/arrow keys; the trigger button + panel items are the real interactive elements. -->
<!-- eslint-disable-next-line @angular-eslint/template/interactive-supports-focus -->
<div class="export-menu" (keydown)="onKeydown($event)">
  <button
    type="button"
    class="trigger p10"
    aria-haspopup="menu"
    [attr.aria-expanded]="open"
    [disabled]="!canExport()"
    (click)="toggle()"
  >
    Exportar
  </button>

  @if (open) {
    <div class="popover">
      <div class="panel" role="menu">
        <button
          type="button"
          class="panel-item"
          role="menuitem"
          [disabled]="isExporting()"
          (click)="exportPng()"
        >
          Exportar para PNG
        </button>
        <button
          type="button"
          class="panel-item"
          role="menuitem"
          [disabled]="isExporting()"
          (click)="exportSvg()"
        >
          Exportar para SVG
        </button>
        <button
          type="button"
          class="panel-item"
          role="menuitem"
          [disabled]="isExporting()"
          (click)="exportDxf()"
        >
          Exportar para DXF
        </button>
      </div>
      @if (exportError(); as message) {
        <p class="export-error" role="alert" aria-atomic="true">{{ message }}</p>
      }
    </div>
  }
</div>
