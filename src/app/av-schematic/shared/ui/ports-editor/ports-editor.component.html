<div class="tabs">
  <button
    type="button"
    class="tab p10"
    [class.is-active]="activeDirection() === 'input'"
    [attr.aria-pressed]="activeDirection() === 'input'"
    (click)="setActiveDirection('input')"
  >
    Inputs ({{ inputs().length }})
  </button>
  <button
    type="button"
    class="tab p10"
    [class.is-active]="activeDirection() === 'output'"
    [attr.aria-pressed]="activeDirection() === 'output'"
    (click)="setActiveDirection('output')"
  >
    Outputs ({{ outputs().length }})
  </button>
</div>

<div class="port-list">
  @for (port of visiblePorts(); track port.id) {
    <div class="port-row">
      <div class="reorder">
        <button
          type="button"
          class="icon-button"
          aria-label="Move up"
          appTooltip="Move port up"
          [disabled]="isFirstInDirection(port)"
          (click)="moveUp(port.id)"
        >
          <span class="icon icon-caret-up" aria-hidden="true"></span>
        </button>
        <button
          type="button"
          class="icon-button"
          aria-label="Move down"
          appTooltip="Move port down"
          [disabled]="isLastInDirection(port)"
          (click)="moveDown(port.id)"
        >
          <span class="icon icon-caret-down" aria-hidden="true"></span>
        </button>
      </div>

      <input
        type="text"
        class="port-input port-label p10"
        placeholder="Label"
        [value]="port.label"
        [appAutofocus]="autofocusPortId() === port.id"
        (input)="updateLabel(port.id, $any($event.target).value)"
      />
      <div class="connector-wrap">
        <label class="visually-hidden" [for]="connectorSelectId(port)">Connector</label>
        <app-select
          size="s"
          [selectId]="connectorSelectId(port)"
          [options]="connectorOptions"
          [value]="port.connectorType ?? ''"
          (valueChange)="updateConnectorType(port.id, $event)"
        />
      </div>

      <div class="row-actions">
        <button
          type="button"
          class="icon-button"
          [attr.aria-label]="port.direction === 'input' ? 'Move to outputs' : 'Move to inputs'"
          [appTooltip]="port.direction === 'input' ? 'Move to outputs' : 'Move to inputs'"
          (click)="toggleDirection(port.id)"
        >
          <span class="icon icon-swap" aria-hidden="true"></span>
        </button>
        <button
          type="button"
          class="icon-button"
          aria-label="Remove port"
          appTooltip="Remove port"
          (click)="removePort(port.id)"
        >
          <span class="icon icon-trash" aria-hidden="true"></span>
        </button>
      </div>
    </div>
  }
</div>

<button
  #addPortButton
  type="button"
  class="ghost-button button-s add-port-button p10"
  (click)="addPort()"
>
  + Add new port
</button>
