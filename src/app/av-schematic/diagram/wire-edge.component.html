<ng-diagram-base-edge [edge]="edge()" [stroke]="strokeColor()" [strokeWidth]="strokeWidth()">
  <ng-diagram-base-edge-label id="wire-id-source" [positionOnEdge]="'30px'">
    <span class="wire-label">{{ edge().data.wireId }}</span>
  </ng-diagram-base-edge-label>
  <ng-diagram-base-edge-label id="wire-id-target" [positionOnEdge]="'-30px'">
    <span class="wire-label">{{ edge().data.wireId }}</span>
  </ng-diagram-base-edge-label>

  @for (handle of segmentHandles(); track handle.id) {
    <ng-diagram-base-edge-label [id]="handle.id" [positionOnEdge]="'0px'">
      <span
        class="bend-handle bend-handle--vertex"
        [style.transform]="handle.transform"
        appEdgeReshape
        (reshapeStart)="onSegmentStart($event, handle.segmentIndex, handle.axis)"
        (reshapeContinue)="onReshapeContinue($event)"
        (reshapeEnd)="onReshapeEnd($event)"
        (contextmenu)="onSegmentContextMenu($event, handle.segmentIndex)"
      ></span>
    </ng-diagram-base-edge-label>
  }

  @for (endpoint of endpointHandles(); track endpoint.id) {
    <ng-diagram-base-edge-label [id]="endpoint.id" [positionOnEdge]="'0px'">
      <span
        class="bend-handle bend-handle--endpoint"
        [style.transform]="endpoint.transform"
        appEdgeReshape
        (reshapeStart)="onEndpointStart($event, endpoint.side)"
        (reshapeContinue)="onEndpointContinue($event)"
        (reshapeEnd)="onEndpointEnd($event)"
      ></span>
    </ng-diagram-base-edge-label>
  }
</ng-diagram-base-edge>
